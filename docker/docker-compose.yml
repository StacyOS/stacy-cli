services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stacy
      POSTGRES_PASSWORD: stacy
      POSTGRES_DB: stacy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacy -d stacy"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://stacy:stacy@db:5432/stacy
      PORT: "3100"
      SERVE_UI: "true"
      STACY_DEPLOYMENT_MODE: "authenticated"
      STACY_DEPLOYMENT_EXPOSURE: "private"
      STACY_PUBLIC_URL: "${STACY_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - stacy-data:/stacy
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  stacy-data:
