services:
  stacy:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${STACY_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      STACY_HOME: "/stacy"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      STACY_DEPLOYMENT_MODE: "authenticated"
      STACY_DEPLOYMENT_EXPOSURE: "private"
      STACY_PUBLIC_URL: "${STACY_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-stacy-local-quickstart-change-me}"
    volumes:
      - "${STACY_DATA_DIR:-../data/docker-stacy}:/stacy"
